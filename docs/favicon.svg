<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#ffffff" />
  
  <!-- Neural Network Nodes and Connections -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main nodes -->
    <circle cx="16" cy="8" r="2" fill="#2563eb" />
    <circle cx="8" cy="16" r="2" fill="#2563eb" />
    <circle cx="24" cy="16" r="2" fill="#2563eb" />
    <circle cx="16" cy="24" r="2" fill="#2563eb" />
    
    <!-- Center node -->
    <circle cx="16" cy="16" r="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    
    <!-- Connections -->
    <path d="M16 10v3M10 16h-1M24 16h1M16 21v3" />
    <path d="M12 12l2 2M20 12l-2 2M12 20l2-2M20 20l-2-2" />
    
    <!-- Pulsing animation for center node -->
    <circle cx="16" cy="16" r="5" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="2,1" opacity="0.5">
      <animate attributeName="r" values="5;6;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
