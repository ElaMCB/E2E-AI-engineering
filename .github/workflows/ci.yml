name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - ai-monitor
          - ai-30day-sprint/p1-csv-chat
          - evals
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            pip install -r ${{ matrix.project }}/requirements.txt
          fi
          pip install pytest pytest-cov pytest-mock coverage
      
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f "test_*.py" ] || [ -f "tests/test_*.py" ]; then
            pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-report=json -v
          else
            echo "No tests found for ${{ matrix.project }}"
            # Create empty coverage report
            echo '{"totals": {"percent_covered": 0.0}}' > coverage.json
          fi
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage.json
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy
      
      - name: Run black check
        run: |
          black --check --diff ai-monitor ai-30day-sprint evals
      
      - name: Run isort check
        run: |
          isort --check-only --diff ai-monitor ai-30day-sprint evals
      
      - name: Run flake8
        run: |
          flake8 ai-monitor ai-30day-sprint evals --max-line-length=120 --ignore=E203,W503

  build-status:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Verify imports
        run: |
          cd ai-monitor && python -c "import monitor, analyzer, generate_html"
          cd ../evals && python -c "import run_ab_test_models_prompts"

  generate-metrics:
    runs-on: ubuntu-latest
    needs: [test, lint, build-status]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download coverage artifacts
        uses: actions/download-artifact@v3
        with:
          path: coverage-artifacts
      
      - name: Generate coverage.json
        run: |
          python .github/scripts/generate_metrics.py --coverage-dir coverage-artifacts --output coverage.json
      
      - name: Run evaluation tests and generate eval.json
        run: |
          python .github/scripts/generate_metrics.py --run-evals --output eval.json
        continue-on-error: true
      
      - name: Commit and push metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add coverage.json eval.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: Update metrics [skip ci]"
            git push
          fi
