name: Weekly AI Monitor

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual runs from GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    name: Monitor AI Developments
    permissions:
      contents: write  # Required to commit results
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd chinese-ai-monitor
          pip install -r requirements.txt
      
      - name: Run AI Monitor
        run: |
          cd chinese-ai-monitor
          python monitor.py
        # Optional: Add NewsAPI key as GitHub secret
        # Uncomment the env section below and add NEWS_API_KEY to GitHub secrets
        # env:
        #   NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      
      - name: Generate HTML Page
        run: |
          cd chinese-ai-monitor
          python generate_html.py
      
      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Force add results (they're in .gitignore but we need them for the website)
          git add -f chinese-ai-monitor/results/weekly_summary.json docs/chinese-ai-monitor.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly AI Monitor Update - $(date +'%Y-%m-%d')"
            git push
          fi

