name: Weekly AI Monitor

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual runs from GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    name: Monitor AI Developments
    permissions:
      contents: write  # Required to commit results
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always use the default GITHUB_TOKEN for clone. A bad or empty METRICS_PAT
          # breaks checkout with: fatal: could not read Username for 'https://github.com'
          # Use METRICS_PAT only in the push step below when it differs from GITHUB_TOKEN.
          ref: main
          fetch-depth: 0  # Fetch full history for proper git operations
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd ai-monitor
          pip install -r requirements.txt
      
      - name: Run AI Monitor
        run: |
          cd ai-monitor
          python monitor.py
        # Optional: Add NewsAPI key as GitHub secret
        # Uncomment the env section below and add NEWS_API_KEY to GitHub secrets
        # env:
        #   NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      
      - name: Generate HTML Page
        run: |
          cd ai-monitor
          python generate_html.py
      
      - name: Run Intelligence Analysis
        run: |
          cd ai-monitor
          python analyzer.py
      
      - name: Generate Intelligence Page
        run: |
          cd ai-monitor
          python generate_intelligence_page.py
      
      - name: Commit and Push Results
        env:
          # Use PAT for git operations to ensure bypass permissions apply
          GIT_TOKEN: ${{ secrets.METRICS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Configure git to use the PAT token for authentication
          if [ -n "$GIT_TOKEN" ] && [ "$GIT_TOKEN" != "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "Using PAT token for authentication (bypass should apply)"
            git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          
          # Ensure we're on main branch
          git checkout main || git checkout -b main
          git pull origin main || true
          
          # Force add results (they're in .gitignore but we need them for the website)
          git add -f ai-monitor/results/weekly_summary.json ai-monitor/results/latest_analysis.json ai-monitor/results/latest_runtime_trace.json docs/ai-monitor.html docs/intelligence.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly AI Monitor Update - $(date +'%Y-%m-%d')"
            # Push using the configured remote (with PAT if available)
            if ! git push origin main; then
              echo "::warning::Failed to push due to branch protection rules"
              echo "::warning::Repository admin role should allow bypass, but push failed"
              echo "::warning::This might indicate the PAT wasn't created by a repository admin"
              echo "::warning::Or the bypass list needs to include the specific user who created the PAT"
              exit 0  # Don't fail the job
            else
              echo "Successfully pushed to main using PAT with bypass permissions"
            fi
          fi

